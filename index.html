<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Privacy lock: the browser blocks this app from loading from or sending data to ANY other server.
     connect-src 'self' = the app can only talk to its own web address (to fetch its own files). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'; worker-src 'self'">
<meta name="referrer" content="no-referrer">
<title>Vet Health Log</title>
<meta name="description" content="Private daily symptom log for VA disability claims. Your data stays on your phone.">
<meta name="theme-color" content="#142850">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface2:#eef0f5; --text:#14171f; --muted:#5b6272;
  --line:#d6dae3; --navy:#142850; --navy-ink:#ffffff; --accent:#1f4fa8; --accent-soft:#e3ebfa;
  --gold:#c8a03c; --danger:#b3261e; --danger-soft:#fde8e7; --ok:#2e7d32; --ok-soft:#e6f4e7;
  --warn-soft:#fff4d6; --shadow:0 1px 3px rgba(0,0,0,.08);
  --radius:14px; --fs:17px; --btn:#1f4fa8; --btn-danger:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218; --surface:#1a1f29; --surface2:#242a36; --text:#eef1f6; --muted:#a3abbb;
    --line:#333a48; --navy:#0b1a38; --accent:#8fb2ff; --accent-soft:#22335a;
    --danger:#ff8a80; --danger-soft:#3d1c1b; --ok:#81c784; --ok-soft:#1d3320; --warn-soft:#3a3218;
    --shadow:none; --btn:#3563c9;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#1a1f29; --surface2:#242a36; --text:#eef1f6; --muted:#a3abbb;
  --line:#333a48; --navy:#0b1a38; --accent:#8fb2ff; --accent-soft:#22335a;
  --danger:#ff8a80; --danger-soft:#3d1c1b; --ok:#81c784; --ok-soft:#1d3320; --warn-soft:#3a3218;
  --shadow:none; --btn:#3563c9;
}
html.big{ --fs:20px; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--text); font-size:var(--fs); line-height:1.4;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
h1,h2,h3{ margin:0; line-height:1.2; }
.hidden{ display:none !important; }

/* Top bar */
.topbar{
  position:sticky; top:0; z-index:20; background:var(--navy); color:var(--navy-ink);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.topbar h1{ font-size:1.15em; font-weight:700; letter-spacing:.2px; }
.topbar .sub{ font-size:.78em; opacity:.8; }
.datenav{ display:flex; align-items:center; gap:8px; margin-top:10px; }
.datenav button.arrow{
  width:48px; height:48px; border-radius:12px; border:0; background:rgba(255,255,255,.14);
  color:#fff; font-size:1.4em; flex:none;
}
.datenav button.arrow:disabled{ opacity:.3; }
.datebtn{
  flex:1; height:48px; border-radius:12px; border:0; background:rgba(255,255,255,.14); color:#fff;
  font-weight:600; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center; text-align:center; padding:0 6px; font-size:.95em;
}
.datebtn input{ position:absolute; inset:0; opacity:0; width:100%; height:100%; }

main{ padding:14px 16px 24px; max-width:640px; margin:0 auto; }

/* Cards */
.card{
  background:var(--surface); border-radius:var(--radius); padding:14px 14px 12px; margin-bottom:14px;
  box-shadow:var(--shadow); border:1px solid var(--line);
}
.card{ scroll-margin-top:150px; }
.card-head{ display:flex; align-items:center; gap:10px; }
.card-head .cicon{ font-size:1.5em; width:1.6em; text-align:center; }
.card-head h2{ font-size:1.1em; flex:1; }
.status{ font-size:.78em; font-weight:600; padding:4px 9px; border-radius:99px; background:var(--surface2); color:var(--muted); white-space:nowrap; }
.status.ok{ background:var(--ok-soft); color:var(--ok); }
.status.part{ background:var(--warn-soft); }

.sev-row{ display:flex; align-items:center; gap:12px; margin-top:12px; }
.sev-val{ width:92px; flex:none; text-align:center; border-radius:12px; padding:6px 4px; background:var(--surface2); }
.sev-val b{ display:block; font-size:1.6em; line-height:1.1; }
.sev-val span{ font-size:.72em; font-weight:600; }
input[type=range].sev{
  -webkit-appearance:none; appearance:none; flex:1; height:44px; background:transparent; margin:0;
}
input[type=range].sev::-webkit-slider-runnable-track{
  height:14px; border-radius:99px;
  background:linear-gradient(90deg,#43a047 0%,#9ccc65 25%,#fbc02d 50%,#fb8c00 75%,#d32f2f 100%);
}
input[type=range].sev::-moz-range-track{
  height:14px; border-radius:99px;
  background:linear-gradient(90deg,#43a047 0%,#9ccc65 25%,#fbc02d 50%,#fb8c00 75%,#d32f2f 100%);
}
input[type=range].sev::-webkit-slider-thumb{
  -webkit-appearance:none; width:38px; height:38px; border-radius:50%; margin-top:-12px;
  background:#fff; border:4px solid var(--navy); box-shadow:0 2px 6px rgba(0,0,0,.35);
}
input[type=range].sev::-moz-range-thumb{
  width:30px; height:30px; border-radius:50%; background:#fff; border:4px solid var(--navy);
}
input[type=range].sev.unset::-webkit-slider-runnable-track{ filter:grayscale(1) opacity(.45); }
input[type=range].sev.unset::-moz-range-track{ filter:grayscale(1) opacity(.45); }
.scale-labels{ display:flex; justify-content:space-between; font-size:.72em; color:var(--muted); margin:0 104px 0 2px; }

.card-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.btn{
  min-height:48px; padding:10px 16px; border-radius:12px; border:0; font-weight:600;
  background:var(--btn); color:#fff;
}
.btn.secondary{ background:var(--accent-soft); color:var(--accent); }
.btn.ghost{ background:var(--surface2); color:var(--text); }
.btn.danger{ background:var(--btn-danger); color:#fff; }
.btn.block{ width:100%; display:block; }
.btn.small{ min-height:40px; padding:6px 12px; font-size:.88em; }
.card-actions .btn{ flex:1; }

.details{ margin-top:12px; border-top:1px solid var(--line); padding-top:6px; }
.field{ margin-top:12px; }
.field > label, .field > .lbl{ display:block; font-weight:600; font-size:.92em; margin-bottom:6px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  min-height:44px; padding:8px 14px; border-radius:99px; border:2px solid var(--line);
  background:var(--surface); color:var(--text); font-size:.92em; text-align:left;
}
.chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
:root[data-theme="dark"] .chip[aria-pressed="true"]{ color:#0f1218; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip[aria-pressed="true"]{ color:#0f1218; } }
/* Compact Daily Log */
html.compact .card[data-cid]{ padding:10px 12px 8px; margin-bottom:10px; }
html.compact .card[data-cid] .card-head .cicon{ font-size:1.25em; }
html.compact .card[data-cid] .card-head h2{ font-size:1em; }
html.compact .card[data-cid] .status{ font-size:.72em; padding:3px 8px; }
html.compact .card[data-cid] .sev-row{ margin-top:2px; gap:10px; }
html.compact .card[data-cid] .sev-val{ width:72px; padding:3px 2px; }
html.compact .card[data-cid] .sev-val b{ font-size:1.25em; }
html.compact .card[data-cid] .sev-val span{ font-size:.66em; }
html.compact .card[data-cid] .scale-labels{ display:none; }
html.compact .card[data-cid] .card-actions{ margin-top:4px; gap:6px; }
html.compact .card[data-cid] .card-actions .btn{ min-height:38px; padding:4px 10px; font-size:.82em; }
html.compact .card[data-cid] .crisis{ margin-top:6px; font-size:.78em; }
html.compact .progress{ margin-bottom:8px; font-size:.82em; }
/* Settings: condition rows */
.cond-row{ gap:6px; }
.iconbtn{ width:44px; height:44px; flex:none; border-radius:10px; border:2px solid var(--line); background:var(--surface2); font-size:1.35em; padding:0; }
.iconbtn[aria-expanded="true"]{ border-color:var(--accent); }
.mv{ width:36px; height:40px; flex:none; border-radius:8px; border:0; background:var(--surface2); color:var(--text); font-size:.8em; padding:0; }
.mv:disabled{ opacity:.3; }
.iconpick{ background:var(--surface2); border-radius:12px; padding:10px; margin:0 0 8px; }
.icongrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(44px, 1fr)); gap:6px; margin-top:6px; }
.icongrid button{ height:44px; border-radius:10px; border:2px solid transparent; background:var(--surface); font-size:1.35em; padding:0; }
.icongrid button[aria-pressed="true"]{ border-color:var(--accent); }
.iconprev{ font-size:1.6em; width:44px; text-align:center; flex:none; }
.namebtn{ background:none; border:0; text-align:left; padding:8px 0; color:var(--text); font:inherit; min-height:44px; }
.privacy li{ margin-bottom:6px; }
.chip.add{ border-style:dashed; color:var(--accent); }
.adder{ display:flex; gap:8px; width:100%; }
.adder input{ flex:1; min-width:0; }
.medrow{ display:flex; align-items:center; gap:8px; margin-top:8px; }
.medrow .medname{ flex:1; min-width:0; border-radius:12px; overflow-wrap:anywhere; }
.medrow select.dose{ flex:0 0 auto; width:auto; max-width:46%; min-height:44px; padding:8px 10px; }
.medrow:not(.on) select.dose{ color:var(--muted); }
.medrow .dose-adder{ flex:0 0 50%; width:auto; }
.medhelp{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:6px 0 4px 10px; }
.medhelp .chip, .chip.mini{ min-height:36px; padding:4px 12px; font-size:.86em; }
.rx-tag{ display:inline-block; font-size:.72em; font-weight:800; padding:1px 6px; border-radius:6px; background:var(--surface2); color:var(--accent); vertical-align:1px; }
.chip[aria-pressed="true"] .rx-tag{ background:rgba(255,255,255,.25); color:inherit; }
label.rx{ display:flex; align-items:center; gap:8px; font-size:.9em; margin-top:4px; min-height:36px; }
label.rx input{ width:22px; height:22px; accent-color:var(--accent); }
input[type=range].sev{ touch-action:pan-y; }
input[type=range].sev.locked{ opacity:.55; pointer-events:none; }
.sev-row[data-act="sevedit"]{ cursor:pointer; }
.sev-hint{ color:var(--accent); font-weight:600; align-self:center; }
/* Meds tab */
.medhead{ display:flex; align-items:center; gap:8px; }
.medhead .micon{ font-size:1.4em; }
.medhead h2{ font-size:1.1em; margin:0; flex:1; min-width:0; overflow-wrap:anywhere; }
.daily{ display:inline-block; font-size:.78em; font-weight:700; padding:4px 9px; border-radius:99px; background:var(--ok-soft); color:var(--ok); white-space:nowrap; }
.kv{ display:flex; gap:8px; font-size:.92em; margin-top:6px; }
.kv > b{ flex:0 0 92px; color:var(--muted); font-weight:600; }
.strip{ display:grid; grid-template-columns:repeat(30,1fr); gap:2px; margin-top:10px; }
.strip i{ height:18px; border-radius:3px; background:var(--surface2); }
.strip i.on{ background:var(--accent); }
.strip i.on.daily{ background:#0e7c74; }
.strip-lbl{ display:flex; justify-content:space-between; font-size:.72em; color:var(--muted); margin-top:2px; }
.helpbar{ display:flex; height:10px; border-radius:99px; overflow:hidden; margin-top:10px; gap:2px; }
.medcard{ padding:10px 14px; margin-bottom:10px; }
.medsum{ display:flex; align-items:center; gap:10px; width:100%; min-height:52px; background:none; border:0; padding:0; text-align:left; color:var(--text); }
.medsum .micon{ font-size:1.4em; }
.medsum .grow{ flex:1; min-width:0; overflow-wrap:anywhere; }
.medsum b{ font-size:1.05em; }
.medsum .daily{ font-size:.7em; padding:2px 7px; vertical-align:1px; }
.medsum .chev{ color:var(--muted); font-size:1.2em; }
.medsum[aria-expanded="true"]{ padding-bottom:6px; border-bottom:1px solid var(--line); margin-bottom:4px; }
.change-note{ margin-top:10px; background:var(--warn-soft); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:.92em; }
.change-note .row{ display:flex; gap:8px; margin-top:8px; }
.change-note .row .btn{ flex:1; }
.timeline{ margin-top:8px; color:var(--muted); }
.chip[aria-pressed="true"] .muted{ color:inherit; opacity:.85; }
.chip.check::before{ content:"☐ "; }
.chip.check[aria-pressed="true"]::before{ content:"☑ "; }
.stepper{ display:flex; align-items:center; gap:8px; }
.stepper button{ width:48px; height:48px; border-radius:12px; border:0; background:var(--surface2); font-size:1.4em; font-weight:700; }
.stepper input{ width:90px; height:48px; text-align:center; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-size:1.1em; }
input[type=text], input[type=date], input[type=time], textarea, select{
  width:100%; min-height:48px; padding:10px 12px; border-radius:12px; border:2px solid var(--line);
  background:var(--surface); color:var(--text);
}
textarea{ min-height:84px; resize:vertical; }
.subhead{ font-size:.8em; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700; margin-top:18px; }

.crisis{ margin-top:10px; font-size:.85em; color:var(--muted); }
.crisis a{ color:var(--accent); font-weight:600; }
.crisis-alert{
  margin-top:12px; background:var(--danger-soft); border:2px solid var(--danger); border-radius:12px; padding:12px;
}
.crisis-alert b{ color:var(--danger); }
.crisis-alert .row{ display:flex; gap:8px; margin-top:10px; }
.crisis-alert .row a{ flex:1; text-align:center; text-decoration:none; }

.banner{
  border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; background:var(--warn-soft);
  border:1px solid var(--line); font-size:.92em;
}
.banner.info{ background:var(--accent-soft); }
.banner .row{ display:flex; gap:8px; margin-top:10px; }
.banner .row .btn{ flex:1; }
.progress{ font-size:.88em; color:var(--muted); margin:0 2px 10px; }

/* Bottom tabs */
nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; background:var(--surface);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1; border:0; background:none; padding:8px 2px 10px; min-height:64px; color:var(--muted);
  font-size:.72em; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:2px;
}
nav.tabs button .ti{ font-size:1.7em; line-height:1; }
nav.tabs button[aria-current="page"]{ color:var(--accent); }

/* History */
.seg{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.chart{ width:100%; height:auto; display:block; }
.stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; }
.stat{ background:var(--surface2); border-radius:12px; padding:10px; }
.stat b{ display:block; font-size:1.4em; }
.stat span{ font-size:.78em; color:var(--muted); font-weight:600; }
.hist-item{
  display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; background:none; border:0;
  border-top:1px solid var(--line); padding:12px 0; color:var(--text);
}
.badge{
  flex:none; width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:1.1em; color:#fff;
}
.hist-item .meta{ font-size:.85em; color:var(--muted); }
.empty{ color:var(--muted); text-align:center; padding:24px 8px; }

/* Settings list */
.row-item{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
.row-item:first-of-type{ border-top:0; }
.row-item .grow{ flex:1; }
.switch{ position:relative; width:58px; height:34px; flex:none; }
.switch input{ opacity:0; width:100%; height:100%; position:absolute; inset:0; margin:0; z-index:2; }
.switch span{ position:absolute; inset:0; background:var(--line); border-radius:99px; transition:.15s; }
.switch span::after{ content:""; position:absolute; width:26px; height:26px; left:4px; top:4px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + span{ background:var(--ok); }
.switch input:checked + span::after{ left:28px; }
.muted{ color:var(--muted); }
.small{ font-size:.85em; }
p{ margin:.5em 0; }
.qr{ background:#fff; padding:12px; border-radius:12px; display:flex; justify-content:center; margin:10px 0; }
.qr svg, .qr img{ width:220px; height:220px; }

/* Overlays */
.overlay{
  position:fixed; inset:0; z-index:100; background:var(--bg); overflow:auto;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
}
.overlay .inner{ max-width:520px; margin:0 auto; }
.pin-wrap{ text-align:center; padding-top:30px; }
.pin-dots{ display:flex; justify-content:center; gap:18px; margin:24px 0; }
.pin-dots i{ width:20px; height:20px; border-radius:50%; border:2px solid var(--text); display:block; }
.pin-dots i.on{ background:var(--text); }
.pin-err{ color:var(--danger); min-height:1.4em; font-weight:600; }
.keypad{ display:grid; grid-template-columns:repeat(3,80px); gap:14px; justify-content:center; margin-top:10px; }
.keypad button{ width:80px; height:80px; border-radius:50%; border:0; background:var(--surface2); font-size:1.7em; font-weight:600; }
.keypad button.txt{ font-size:.85em; background:none; }
.toast{
  position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:#222; color:#fff; padding:12px 18px; border-radius:12px; z-index:200; font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,.3); max-width:90vw; text-align:center;
}
.welcome-hero{ background:var(--navy); color:#fff; border-radius:var(--radius); padding:20px 16px; margin-bottom:14px; }
.welcome-hero img{ width:64px; height:64px; border-radius:14px; }
.cond-pick{ display:flex; flex-direction:column; gap:8px; }
.cond-pick .chip{ border-radius:12px; width:100%; }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay-root"></div>
<script src="jspdf.umd.min.js" defer></script>
<script src="qrcode.min.js" defer></script>
<script src="app.js" defer></script>
<noscript><p style="padding:20px">This app needs JavaScript turned on.</p></noscript>
</body>
</html>
